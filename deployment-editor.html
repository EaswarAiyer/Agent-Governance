<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Deployment Task Editor — Endpoint Central</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="prism-theme.css"><script src="prism-shell.js" defer></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Lato,'Segoe UI',Arial,sans-serif;background:#f5f6fa;color:#273142}.top{height:48px;background:#222;color:#fff;display:flex;align-items:center;padding:0 16px;font-weight:600}.top i{color:#a9a2ff;margin-right:9px}.page{max-width:780px;margin:auto;padding:26px 28px}.back{display:inline-flex;gap:7px;align-items:center;color:#1a73e8;text-decoration:none;font:600 13px inherit;margin-bottom:17px}.title{font-size:22px;color:#202124}.sub{font-size:13px;color:#6b7280;margin:5px 0 20px}.card{background:#fff;border:1px solid #e0e5ed;border-radius:8px;overflow:hidden}.card h2{padding:14px 17px;border-bottom:1px solid #e5e7eb;font-size:14px}.body{padding:17px}.field{margin-bottom:18px}.field:last-child{margin-bottom:0}.label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.input,.select{width:100%;border:1px solid #d7dee8;border-radius:5px;padding:10px 11px;background:#fff;font:13px inherit}.hint{margin-top:6px;font-size:12px;color:#6b7280}.count{margin-top:8px;color:#1a56db;font-size:12px;font-weight:700}.status{display:inline-flex;padding:4px 8px;border-radius:10px;background:#fff7e8;color:#9a6500;font-size:11px;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.btn{border:1px solid #d5dbe5;background:#fff;border-radius:5px;padding:9px 13px;font:600 13px inherit;cursor:pointer}.btn.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}</style></head><body><header class="top"><i class="fa fa-robot"></i> Endpoint Central</header><main class="page"><a class="back" href="deployment.html"><i class="fa fa-arrow-left"></i>Back to Policy Deployment</a><h1 class="title" id="title">Create Deployment Task</h1><p class="sub">Associate one AI-agent policy with one target endpoint group.</p><section class="card"><h2>Deployment Task</h2><div class="body"><div class="field"><label class="label">Deployment Task Name</label><input class="input" id="name" placeholder="Enter a deployment task name"></div><div class="field"><label class="label">AI Agent Policy</label><select class="select" id="policy"></select><p class="hint">Only one policy can be associated with a deployment task.</p></div><div class="field"><label class="label">Target Endpoint Group</label><select class="select" id="group" onchange="updateCount()"><option value="engineering">Engineering Windows</option><option value="mac">Developer Macs</option><option value="finance">Finance Windows</option></select><p class="hint">Current group membership determines the target endpoints.</p><div class="count" id="count"></div></div><div class="field"><label class="label">Task Status</label><span class="status" id="status">Yet to start</span></div></div></section><div class="actions"><button class="btn" onclick="location.href='deployment.html'">Cancel</button><button class="btn primary" onclick="save()">Save Deployment</button></div></main><script src="endpoint-data.js"></script><script>const id=new URLSearchParams(location.search).get('task'),task=DEPLOYMENT_TASKS.find(item=>item.id===id),groups={engineering:42,mac:18,finance:12};document.getElementById('title').textContent=task?'Modify Deployment Task':'Create Deployment Task';document.getElementById('name').value=task?.name||'';document.getElementById('policy').innerHTML=ENDPOINT_POLICY_CATALOG.map(policy=>`<option value="${policy.id}" ${task?.policyId===policy.id?'selected':''}>${policy.name}</option>`).join('');document.getElementById('group').value=task?.targetIds.length===18?'mac':task?.targetIds.length===12?'finance':'engineering';document.getElementById('status').textContent=task?'In progress':'Yet to start';function updateCount(){const value=document.getElementById('group').value;document.getElementById('count').textContent=`${groups[value]} endpoints currently targeted.`}function save(){alert('Deployment task saved successfully.');location.href=task?`deployment-details.html?task=${task.id}`:'deployment.html'}updateCount();</script></body></html>
