<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AI Agent Policy Details — Endpoint Central</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="prism-theme.css">
  <script src="prism-shell.js" defer></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Lato,'Segoe UI',Arial,sans-serif;background:#f5f6fa;color:#273142;min-height:100vh}a{text-decoration:none;color:inherit}.top{height:48px;background:#222;color:#fff;display:flex;align-items:center;padding:0 16px;font-weight:600}.top i{color:#a9a2ff;margin-right:9px}.page{max-width:1180px;margin:auto;padding:24px 28px 38px}.back{display:inline-flex;gap:7px;align-items:center;color:#1a73e8;font-size:13px;font-weight:600;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.title{font-size:22px;color:#202124}.subtitle{font-size:13px;color:#6b7280;margin-top:5px}.btn{border:1px solid #d5dbe5;background:#fff;color:#394150;border-radius:5px;padding:9px 13px;font:600 13px inherit;cursor:pointer}.btn.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}.card{background:#fff;border:1px solid #e0e5ed;border-radius:8px;margin-bottom:16px;overflow:hidden}.card h2{padding:14px 17px;border-bottom:1px solid #e5e7eb;font-size:14px}.card-body{padding:16px 17px}.identity{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}.identity-item,.field{padding:12px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;min-height:70px}.identity-item:nth-child(5n){border-right:0}.label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.45px;color:#7b8494;margin-bottom:7px}.value{font-size:13px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.section-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid #edf0f4;border-radius:6px;overflow:hidden}.field:nth-child(3n){border-right:0}.field:nth-last-child(-n+3){border-bottom:0}.chip{display:inline-flex;align-items:center;background:#eef3ff;color:#195abe;border-radius:12px;padding:3px 8px;margin:0 4px 4px 0;font-size:11px;font-weight:700}.chip.block{background:#fff0f0;color:#ba3f4f}.tag{display:inline-flex;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}.tag.strict{background:#fff0f0;color:#ba3f4f}.tag.audit{background:#fff7e8;color:#9a6500}.empty{font-size:12px;color:#8b95a5;font-style:italic}.rules{display:grid;gap:10px}.rule{border:1px solid #e4e8ef;border-radius:6px;padding:13px}.rule-title{font-size:13px;font-weight:700;margin-bottom:9px;color:#273142}.rule-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.rule-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#7b8494;font-weight:700;margin-bottom:5px}@media(max-width:850px){.identity{grid-template-columns:repeat(2,1fr)}.identity-item:nth-child(5n){border-right:1px solid #edf0f4}.identity-item:nth-child(2n){border-right:0}.section-grid,.rule-grid{grid-template-columns:1fr}.field{border-right:0}.field:nth-last-child(-n+3){border-bottom:1px solid #edf0f4}.field:last-child{border-bottom:0}}
  </style>
</head>
<body>
  <header class="top"><i class="fa fa-robot"></i> Endpoint Central</header>
  <main class="page">
    <a class="back" href="privilege-control.html"><i class="fa fa-arrow-left"></i>Back to Policies</a>
    <div class="head"><div><h1 class="title" id="policyName">AI Agent Policy</h1><p class="subtitle">Review the configured controls, access rules, remediation, and prompt monitoring for this policy.</p></div><button class="btn primary" id="modify"><i class="fa fa-pen"></i> Modify</button></div>
    <section class="card"><h2>Policy Details</h2><div class="identity" id="identity"></div></section>
    <section class="card"><h2>Agent Control</h2><div class="card-body"><div class="section-grid" id="agentControl"></div></div></section>
    <section class="card"><h2>Auto Uninstallation</h2><div class="card-body"><div class="section-grid" id="autoUninstall"></div></div></section>
    <section class="card"><h2>Advanced Execution Rules</h2><div class="card-body"><div class="rules" id="rules"></div></div></section>
    <section class="card"><h2>Prompt Monitoring &amp; Classification</h2><div class="card-body"><div class="section-grid" id="promptMonitoring"></div></div></section>
  </main>
  <script src="endpoint-data.js"></script>
  <script>
    const params=new URLSearchParams(location.search),policyId=params.get('policy')||'POL-001',policy=ENDPOINT_POLICY_CATALOG.find(item=>item.id===policyId)||ENDPOINT_POLICY_CATALOG[0],platform=params.get('platform')||'Windows';
    const modified={"POL-001":['easwar','Jun 2, 2026 02:30 PM','May 18, 2026 10:15 AM'],"POL-002":['easwar','Jun 1, 2026 11:45 AM','May 22, 2026 04:20 PM'],"POL-003":['security.admin','May 31, 2026 09:10 AM','May 12, 2026 03:05 PM']}[policy.id]||['easwar','Jun 2, 2026 02:30 PM','May 18, 2026 10:15 AM'];
    const chips=(items,kind='')=>items.length?items.map(item=>`<span class="chip ${kind}">${item}</span>`).join(''):'<span class="empty">None</span>';
    const field=(label,value)=>`<div class="field"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    document.title=`${policy.name} — AI Agent Policy Details`;document.getElementById('policyName').textContent=policy.name;document.getElementById('modify').onclick=()=>location.href=`policy-editor.html?policy=${policy.id}&platform=${encodeURIComponent(platform)}`;
    document.getElementById('identity').innerHTML=[['Policy Name',policy.name],['Operating System',platform],['Modified By',modified[0]],['Last Modified',modified[1]],['Created Time',modified[2]]].map(([label,value])=>`<div class="identity-item"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('');
    document.getElementById('agentControl').innerHTML=field('Allow List',chips(policy.allow))+field('Block List',chips(policy.block,'block'))+field('Agent Enforcement Mode',`<span class="tag ${policy.agentMode.toLowerCase()}">${policy.agentMode}</span>`);
    document.getElementById('autoUninstall').innerHTML=field('Auto-uninstall Block List Agents',policy.autoUninstall?'Enabled':'Disabled');
    document.getElementById('rules').innerHTML=policy.allow.length?policy.allow.map((agent,index)=>`<article class="rule"><div class="rule-title">${agent}</div><div class="rule-grid"><div><div class="rule-label">Accessible Folders</div><div class="value">${chips(index?[]:policy.folders)}</div></div><div><div class="rule-label">Website Groups</div><div class="value">${chips(index?[]:policy.websiteGroups)}</div></div><div><div class="rule-label">Application Groups</div><div class="value">${chips(index?[]:policy.applicationGroups)}</div></div></div></article>`).join(''):'<div class="empty">No advanced execution rules are configured.</div>';
    document.getElementById('promptMonitoring').innerHTML=field('Enable Prompt Data Collection',policy.promptCollection?'Enabled':'Disabled')+field('Data Groups to Monitor',chips(policy.classifiers))+field('DLP Mode',policy.promptCollection?`<span class="tag ${policy.dlpMode.toLowerCase()}">${policy.dlpMode}</span>`:'<span class="empty">Not configured</span>');
  </script>
</body>
</html>
